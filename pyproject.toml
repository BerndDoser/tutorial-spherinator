[project]
name = "tutorial-spherinator"
version = "0.1.0"
description = "Tutorial for Spherinator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "spherinator",
]

[tool.uv.sources]
spherinator = { git = "https://github.com/HITS-AIN/Spherinator.git"}

[tool.uv]
# torch pins nvidia-cudnn-cu13==9.20.0.48, whose wheel omits
# libcudnn_engines_tensor_ir.so.9. cuDNN then dlopens that sublibrary by bare
# SONAME and picks up a system cuDNN of a different version, giving
# CUDNN_STATUS_SUBLIBRARY_VERSION_MISMATCH. 9.25.1.1 ships the full set.
override-dependencies = ["nvidia-cudnn-cu13==9.25.1.1"]
