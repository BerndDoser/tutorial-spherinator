[project]
name = "tutorial-spherinator"
version = "0.1.0"
description = "Tutorial for Spherinator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Not "astro-hipster[cuda]": that extra adds onnxruntime-gpu, which installs
    # into the same "onnxruntime" package directory as the CPU wheel the base
    # dependencies require, and the two shadow each other. The CPU wheel is
    # enough here - ONNX inference only runs the small encoder and decoder,
    # while training uses torch on the GPU.
    "astro-hipster",
    "ipyaladin>=0.8",
    "ipykernel>=7.3.0",
    "onnxruntime>=1.30.0",
    "spherinator",
]

[tool.uv.sources]
astro-hipster = { git = "https://github.com/HITS-AIN/HiPSter.git" }
spherinator = { git = "https://github.com/HITS-AIN/Spherinator.git"}

[tool.uv]
# torch pins nvidia-cudnn-cu13==9.20.0.48, whose wheel omits
# libcudnn_engines_tensor_ir.so.9. cuDNN then dlopens that sublibrary by bare
# SONAME and picks up a system cuDNN of a different version, giving
# CUDNN_STATUS_SUBLIBRARY_VERSION_MISMATCH. 9.25.1.1 ships the full set.
override-dependencies = ["nvidia-cudnn-cu13==9.25.1.1"]
